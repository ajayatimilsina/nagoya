<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>あじまるや | ご注文</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="customer-page">
  <header class="brand-bar">
    <div class="brand-lockup"><strong>あじまるや</strong><span>中島駅 · ご注文</span></div>
    <span class="live-mark" aria-label="注文受付中"></span>
  </header>
  <nav id="category-nav" class="category-nav" aria-label="メニューカテゴリー"></nav>
  <main id="customer-main" class="customer-main">
    <section class="customer-meta" aria-label="ご注文情報">
      <div class="meta-heading"><div><span class="eyebrow">YOUR TABLE</span><h1 id="table-heading">Table 1</h1></div><span id="party-total" class="party-total">合計 2名</span></div>
      <div class="party-grid">
        <label>大人<select id="adults"></select></label>
        <label>子ども<select id="children"></select></label>
        <label>性別<select id="gender"><option>All</option><option>Men</option><option>Women</option></select></label>
        <label>アレルギー<select id="allergy"><option>なし</option><option>あり</option></select></label>
        <label class="member-check"><input id="member-price" type="checkbox"><span>会員価格</span></label>
      </div>
      <label class="receipt-check"><input id="receipt-needed" type="checkbox"><span>領収書が必要です</span></label>
      <label id="addressee-field" class="addressee-field" hidden>宛名<input id="addressee" maxlength="80" placeholder="領収書の宛名"></label>
    </section>

    <section id="notice-region" class="notice-region" aria-live="polite"></section>
    <section id="status-region" class="status-region" aria-live="polite"></section>
    <div id="menu-sections" class="menu-sections" aria-live="polite"><p class="loading-line">メニューを読み込んでいます…</p></div>
    <footer class="customer-footer">
      <p>あじまるや · 中島駅</p>
      <button id="call-staff-footer" class="btn btn-outline-secondary call-staff">店員を呼ぶ</button>
    </footer>
  </main>

  <aside class="order-dock" aria-label="注文">
    <div><strong id="cart-count">0点</strong><span><span id="cart-total">¥0</span> · <span id="cart-party">2名</span></span></div>
    <button id="open-cart" class="btn btn-primary" disabled>注文する</button>
  </aside>

  <dialog id="cart-dialog" class="cart-dialog">
    <form method="dialog" class="dialog-top"><div><span class="eyebrow">ORDER REVIEW</span><h2>ご注文内容</h2></div><button class="icon-button" value="cancel" aria-label="閉じる">×</button></form>
    <div id="cart-lines" class="cart-lines"></div>
    <label class="notes-field">ご注文の特別なご要望<textarea id="order-notes" rows="3" maxlength="500" placeholder="辛さ・アレルギーなど"></textarea></label>
    <div class="dialog-total"><span>合計</span><strong id="dialog-total">¥0</strong></div>
    <div class="dialog-actions"><button id="cancel-order" class="btn btn-outline-secondary" type="button">戻る</button><button id="submit-order" class="btn btn-primary" type="button">注文を送信する</button></div>
  </dialog>
  <div id="toast" class="toast-message" role="status" aria-live="polite"></div>
  <script type="module" src="/customer.js"></script>
</body>
</html>
